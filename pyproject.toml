[project]
name = "golf-api"
version = "0.1.0"
description = "Client and schema tooling for the (unofficial) PGA TOUR GraphQL API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "graphql-core>=3.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "redis>=8.1.0",
]

# No [build-system] on purpose: this keeps the project "virtual" so `uv run`
# manages the venv + deps without trying to build/install `golf-api` itself.
# Scripts add the repo root to sys.path to import the `pga` package.
